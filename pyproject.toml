[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "remixii"
version = "0.1.0"
description = "Local AI remix studio and portable .remix project player"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "gradio>=5.49,<6",
  "imageio-ffmpeg>=0.6,<1",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pyinstaller>=6.16,<7"]

[project.scripts]
remixii = "remixii.app:main"

[tool.setuptools.packages.find]
include = ["remixii*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
